<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Food Diary</title>

    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js">
    </script>

    <style>

    body{
        background-color: linen;
        font-family: Arial, sans-serif;
        text-align: center;
        padding: 30px;
    }

    h2{
        color: chocolate;
        margin-top: 25px;
    }

    abbr{
        color: chocolate;
        font-weight: bold;
        cursor: help;
    }
    hr{border-color: rgb(210, 138, 30);
    border-width: 4px;}
     mark{background-color:darkgoldenrod }

     blockquote{
       border-left: 4px solid rgb(210, 153, 30);
       padding-left: 15px;
       color: dimgray;
       font-style: italic;
       text-align: left;
       display: inline-block;
     }


    </style>
</head>
<body>
    
    <p class="display-1">My Food Diary</p>
    <p class="display-2">My Top Dishes</p>
    <p class="display-3">Fun Food Facts</p>
    <p class="display-4">Food Guide <small>by Tareesha</small></p>

    <p class="display-4">Did you know</p>
    <p> Pizza is the <mark>most popular food</mark></p>

    <p class="display-4">Cooking Style</p>
    <p>My favourite is good old <abbr title="Barbecue">BBQ</abbr></p>
    <hr>
    <p class="display-4">Famous Quote</p>
   <blockquote>First we eat, then we do everything else. -M.F.K Fisher</blockquote>
</body>
</html>
