<!--
1) Start the HTML document.
   a) Use `<!DOCTYPE html>` to define the page as an HTML5 document.
   b) Open the `<html>` tag.

2) Create the head section.
   a) Set the page title as "My Hobby Cards".
   b) Add character encoding using `<meta charset="utf-8">`.
   c) Add the viewport meta tag for responsive design.
   d) Link Bootstrap CSS using the CDN link.
   e) Add internal CSS using the `<style>` tag.

3) Style the webpage.
   a) Style the `body` with background colour, font, and padding.
   b) Center-align and colour the main heading.
   c) Use `.hobby-card` to style each hobby card.
   d) Style hobby card headings using `.hobby-card h3`.

4) Create the page heading.
   a) Add the main heading "My Hobby Cards".

5) Create the Bootstrap container and row.
   a) Use `container` to keep the content centred.
   b) Use `row` to arrange the cards in one layout row.

6) Create responsive hobby columns.
   a) Use `col-12` for full width on phones.
   b) Use `col-md-6` for half width on tablets.
   c) Use `col-lg-4` for one-third width on desktops.

7) Add the hobby cards.
   a) Create a card for Drawing.
   b) Create a card for Football.
   c) Create a card for Reading.
   d) Add a heading and short description inside each card.

8) Add Bootstrap JavaScript.
   a) Link the Bootstrap JS file using the `<script>` tag.

9) Close the `<body>` and `<html>` tags to complete the webpage.
-->

<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">

</script>
