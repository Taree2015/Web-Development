<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colour Card</title>

    <style>

    /*unversal selector*/
    *{ font: 16px;
    }

    body{
        background-color:cyan;
    }
    h1{color:burlywood;
    }
    h2{
        color: darkblue;
    }
    p{color: rgb(160, 94, 8);}

    .my-detail{color: coral;
    font-weight: bold;}

    #my-card{background-color:rgb(142, 142, 243);}
    </style>
</head>
<body>
    <h1>My Colour Card</h1>
<p style="color:blueviolet;">Hi this is my very own webpage</p>

<div id="my-card">

    <h2>About Me</h2>
    <p class="my-detail">My name is Tareesha</p>
    <p class="my-detail">My favourite colour is cyan.</p>
    <p class="my-detail">My favourite subject is maths.</p>
    <p class="my-detail">My favourite fastfood is pizza.</p>

</div>

<h2>My Favourite Things</h2>
<p> My favourite animal is a parrot.</p>
<p> My favourite sport is cricket.</p>
<p> My favourite movie is Wall-E.</p>

</body>
</html>
